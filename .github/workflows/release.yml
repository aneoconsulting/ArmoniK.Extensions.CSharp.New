name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  buildImages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - img : dockerhubaneo/armonik-dynamic-dotnet-worker
          path : ./ArmoniK.Extensions.CSharp.DynamicWorker/Dockerfile
          suffix: ""
          base: mcr.microsoft.com/dotnet/aspnet:10.0
        - img : dockerhubaneo/armonik-dynamic-dotnet-worker
          path : ./ArmoniK.Extensions.CSharp.DynamicWorker/Dockerfile
          suffix: "-resolute-chiseled-extra"
          base: mcr.microsoft.com/dotnet/aspnet:10.0-resolute-chiseled-extra
        - img : dockerhubaneo/armonik-dynamic-dotnet-worker
          path : ./ArmoniK.Extensions.CSharp.DynamicWorker/Dockerfile
          suffix: "-azurelinux4.0-distroless-extra"
          base: mcr.microsoft.com/dotnet/aspnet:10.0-azurelinux4.0-distroless-extra

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        ref: ${{ github.ref }}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

    - name: login
      uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
      with:
        username: ${{ secrets.DOCKER_HUB_LOGIN }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: platforms
      run: echo ${{ steps.buildx.outputs.platforms }}

    - name: Build and push
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
      with:
        file: ${{ matrix.path }}
        context: .
        build-args: |
          BASE_IMAGE=${{ matrix.base }}
        platforms: |
          linux/arm64
          linux/amd64
        push: true
        tags: |
            dockerhubaneo/armonik-dynamic-dotnet-worker:${{ github.ref_name }}${{ matrix.suffix }}
            dockerhubaneo/armonik-dynamic-dotnet-worker:latest${{ matrix.suffix }}

  buildProjects:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      with:
        ref: ${{ github.ref }}
        submodules: true
    - name: Build the package
      run: |
        dotnet build ArmoniK.Extensions.CSharp.sln -c Release -p:Version=${{ github.ref_name }}
    - name: Pack the package VERSION
      run: |
        dotnet pack ArmoniK.Extensions.CSharp.sln -c Release -o /tmp/packages -p:Version=${{ github.ref_name }}
    - name: Push the package
      run: |
        dotnet nuget push /tmp/packages/ArmoniK* -k ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
